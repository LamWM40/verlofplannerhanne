<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Verlofplanner 5.0</title>
<link rel="manifest" href="manifest.json">

<style>
:root {
  --bg-color: #f0f2f5;
  --card-bg: #ffffff;
  --primary-yellow: #ffeb3b;
  --text-black: #1a1a1a;
  --btn-shadow: 5px 5px 10px #bebebe, -5px -5px 10px #ffffff;
  --btn-pressed: inset 3px 3px 6px #bebebe, inset -3px -3px 6px #ffffff;
}

body { 
  font-family: 'Segoe UI', Arial, sans-serif; 
  margin:0; padding:0; 
  background: var(--bg-color); 
  color: #333;
  user-select: none;
}

header { 
  background: var(--primary-yellow); 
  padding:25px; 
  text-align:center; 
  box-shadow: 0 2px 8px rgba(0,0,0,0.1);
}

/* SAMENVATTING */
.summary-container {
  background: white;
  margin: 15px;
  border-radius: 25px;
  padding: 25px 15px;
  box-shadow: var(--btn-shadow);
}

.summary-days {
  font-size: 38px;
  font-weight: 900;
  color: var(--text-black);
}

/* GRID */
.container { 
  display:grid; 
  grid-template-columns: 1fr 1fr;
  gap:20px; 
  padding:15px;
}

.card { 
  background: var(--card-bg); 
  padding:20px 15px; 
  border-radius:25px; 
  box-shadow: var(--btn-shadow);
  text-align: center;
}

.card h3 { margin: 0; font-size: 28px; font-weight: 800; }

/* EXTRA GROTE KNOPPEN */
button { 
  padding: 18px 5px; /* Extra hoog voor gsm */
  width: 100%; 
  border: none;
  border-radius: 18px;
  background: #f0f2f5;
  font-weight: 800;
  font-size: 14px;
  cursor: pointer;
  box-shadow: var(--btn-shadow);
  transition: all 0.1s;
  margin-bottom: 12px;
  -webkit-tap-highlight-color: transparent;
}

button:active {
  box-shadow: var(--btn-pressed);
  transform: translateY(2px);
}

.btn-reset { color: #cc0000; margin-bottom: 0; font-size: 12px; }
.btn-minus { color: #0056b3; background: #e3f2fd; }
.btn-notif { background: #fff; margin: 20px; width: calc(100% - 40px); color: #555; }

input { 
  width: 70%; 
  padding: 12px; 
  border: none; 
  border-radius: 12px; 
  background: #f0f2f5;
  box-shadow: inset 2px 2px 5px #bcbcbc, inset -2px -2px 5px #ffffff;
  text-align: center;
  font-size: 18px;
  margin-bottom: 15px;
}
</style>
</head>

<body>

<header>
  <h2 style="margin:0;">Verlofplanner</h2>
</header>

<div class="summary-container" id="summary"></div>
<div class="container" id="app"></div>

<button class="btn-notif" onclick="testNotification()">🔔 Test Pushmelding</button>

<script>
const sbPlanning = {
  "januari": ["april", "mei", "juni", "juli", "augustus"],
  "februari": [], "maart": [], "april": [], "mei": [],
  "juni": ["september"], "juli": ["oktober"], "augustus": ["november"],
  "september": ["december"], "oktober": ["januari"],
  "november": ["februari"], "december": ["maart"]
};

const codes = {
 EL: {name:'Eindeloopbaan', hours:8},
 R: {name:'Overuren', hours:10.5},
 F: {name:'Feestdag', hours:0},
 C: {name:'Compensatie', hours:5.5},
 S: {name:'Verlof', hours:15},
 B: {name:'Verlof B', hours:120}
};

const workDayHours = 8;

// PUSH MELDINGEN TOESTEMMING
if ("Notification" in window) {
  Notification.requestPermission();
}

function testNotification() {
  if (Notification.permission === "granted") {
    new Notification("Verlofplanner Update", {
      body: "Vergeet je uren niet te checken voor de 15e!",
      icon: "https://cdn-icons-png.flaticon.com/512/3652/3652191.png"
    });
  } else {
    alert("Zet meldingen aan in je browserinstellingen.");
  }
}

function getFutureMonthText(){
  const now = new Date();
  const currentMonth = now.toLocaleString('nl-NL', { month: 'long' });
  const future = new Date(now.getFullYear(), now.getMonth() + 3, 1);
  return `Deadline: 15 ${currentMonth} voor ${future.toLocaleString('nl-NL', { month: 'long' })}`;
}

function getSBPlanningText() {
  const now = new Date();
  const currentMonthName = now.toLocaleString('nl-NL', { month: 'long' }).toLowerCase();
  const plannedMonths = sbPlanning[currentMonthName];
  return (plannedMonths && plannedMonths.length > 0) ? `SB gepland: ${plannedMonths.join(', ')}` : `SB: Geen data voor ${currentMonthName}`;
}

function load(){
 const saved = JSON.parse(localStorage.getItem('data'));
 const monthKey = new Date().getFullYear() + '-' + (new Date().getMonth()+1);
 if(!saved || saved.month !== monthKey){
  const newData = { month: monthKey, values: JSON.parse(JSON.stringify(codes)) };
  localStorage.setItem('data', JSON.stringify(newData));
  return newData.values;
 }
 return saved.values;
}

function save(values){
 const monthKey = new Date().getFullYear() + '-' + (new Date().getMonth()+1);
 localStorage.setItem('data', JSON.stringify({ month: monthKey, values }));
}

function update(code, value){
 const data = load();
 data[code].hours = parseFloat(value) || 0;
 save(data);
 render();
}

function minusHalfDay(code){
 const data = load();
 data[code].hours = Math.max(0, data[code].hours - 4);
 save(data);
 render();
}

function resetCode(code){
 if(confirm('Zeker weten?')) {
  const data = load();
  data[code].hours = 0;
  save(data);
  render();
 }
}

function render(){
 const data = load();
 const app = document.getElementById('app');
 const summary = document.getElementById('summary');
 app.innerHTML='';

 let totalRFC = 0, totalSB = 0;

 Object.keys(data).forEach(code=>{
  const item = data[code];
  const days = (item.hours / workDayHours);
  if(['R','F','C'].includes(code)) totalRFC += days;
  if(['S','B'].includes(code)) totalSB += days;

  const div = document.createElement('div');
  div.className='card';
  div.innerHTML = `
   <h3>${code}</h3>
   <p style="font-size:10px; color:#888; margin-top:-5px;">${item.name}</p>
   <div style="font-size:22px; font-weight:bold; margin:10px 0;">${days.toFixed(2)} <small style="font-size:12px;">dgn</small></div>
   <input type="number" step="0.5" value="${item.hours}" onchange="update('${code}', this.value)">
   <button class="btn-minus" onclick="minusHalfDay('${code}')">➖ ½ DAG</button>
   <button class="btn-reset" onclick="resetCode('${code}')">RESET</button>
  `;
  app.appendChild(div);
 });

 summary.innerHTML = `
   <div style="text-align:center;">
     <small style="color:#666;">TOTAAL OVERUREN (R+F+C)</small>
     <div class="summary-days">${totalRFC.toFixed(2)}</div>
     <small style="color:#888;">${getFutureMonthText()}</small>
     <div style="border-top:1px solid #eee; margin:15px 0;"></div>
     <small style="color:#666;">TOTAAL VERLOF (S+B)</small>
     <div class="summary-days">${totalSB.toFixed(2)}</div>
     <small style="color:#888;">${getSBPlanningText()}</small>
   </div>
 `;
}

render();
</script>

</body>
</html>
