<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Verlofplanner</title>
<link rel="manifest" href="manifest.json">

<style>

body{
  font-family:Arial;
  margin:0;
  padding:0;
  background:#eef0f3;
}

/* HEADER */
header{
  background:linear-gradient(to right,#ffeb3b,#ffd600);
  color:#000;
  padding:20px;
  text-align:center;
  border-bottom:4px solid #000;
  position:relative;
}

header::after{
  content:"Hanne";
  position:absolute;
  top:50%;
  left:50%;
  transform:translate(-50%,-50%);
  font-size:60px;
  font-family:cursive;
  opacity:0.25;
}

/* LINES */
.header-line{
  border-top:3px solid #000;
  margin-top:12px;
}

.summary-line{
  height:4px;
  background:#000;
  margin:25px 20px;
  border-radius:3px;
}

/* SUMMARY */
.summary{
  text-align:center;
  padding:12px;
  font-weight:bold;
  font-size:20px;
  background:#fff;
  margin:10px 15px;
  border-radius:12px;
  box-shadow:0 2px 8px rgba(0,0,0,0.08);
}

.summary-small{
  text-align:center;
  font-size:14px;
  margin-top:5px;
  margin-bottom:10px;
  color:#333;
}

/* GRID */
.container{
  display:grid;
  grid-template-columns:1fr 1fr 1fr;
  gap:10px;
  padding:10px;
}

.card{
  background:#fff;
  padding:12px;
  border-radius:12px;
  box-shadow:0 3px 10px rgba(0,0,0,0.08);
}

/* INPUT */
input{
  width:100%;
  padding:8px;
  margin-top:6px;
  border:1px solid #ccc;
  border-radius:8px;
}

/* BUTTONS */
button{
  margin-top:8px;
  padding:10px;
  width:100%;
  border:none;
  border-radius:10px;
  background:linear-gradient(to bottom,#f2f2f2,#d0d0d0);
  font-weight:bold;
  box-shadow:0 4px 0 #9a9a9a,0 6px 10px rgba(0,0,0,0.2);
  cursor:pointer;
}

button:active{
  transform:translateY(3px);
  box-shadow:0 1px 0 #9a9a9a,0 2px 5px rgba(0,0,0,0.2);
}

/* MOBILE */
@media(max-width:768px){
  .container{grid-template-columns:1fr;}
}

</style>
</head>

<body>

<header>
<h2>Verlofplanner</h2>
<div class="header-line"></div>
</header>

<div id="summary"></div>
<div class="container" id="app"></div>

<script>

/////////////////////////////////////////////////////
// 🔥 S+B PLANNING (VERPLAATST BOVEN CODES)
/////////////////////////////////////////////////////
const sbPlanning = {
  "oktober": ["januari"],
  "november": ["februari"],
  "december": ["maart"],
  "januari": ["april", "mei", "juni", "juli", "augustus"],
  "juni": ["september"],
  "juli": ["oktober"],
  "augustus": ["november"],
  "september": ["december"]
};

/////////////////////////////////////////////////////
// CODES
/////////////////////////////////////////////////////
const codes = {
  EL: {name:'Eindeloopbaan', hours:8},
  R: {name:'Overuren', hours:10.5},
  F: {name:'Feestdag', hours:0},
  C: {name:'Compensatie', hours:5.5},
  S: {name:'Verlof', hours:15},
  B: {name:'Verlof B', hours:120}
};

const workDayHours = 8;

/* RFC */
function getRFCText(){
  const now = new Date();
  const currentMonth = now.toLocaleString('nl-NL',{month:'long'});
  const future = new Date(now.getFullYear(),now.getMonth()+3,1);
  const futureMonth = future.toLocaleString('nl-NL',{month:'long'});
  return `15 ${currentMonth} = ${futureMonth}`;
}

/* S+B tekst */
function getSBText(){

  const maand = new Date()
    .toLocaleString('nl-NL',{month:'long'});

  const lijst = sbPlanning[maand];

  if(!lijst) return "";

  return "Aanvragen: " + lijst.join(", ");
}

function getCurrentMonthKey(){
  const d = new Date();
  return d.getFullYear() + '-' + (d.getMonth()+1);
}

function load(){
  const saved = JSON.parse(localStorage.getItem('data'));
  const monthKey = getCurrentMonthKey();

  if(!saved || saved.month !== monthKey){
    const newData = {
      month: monthKey,
      values: JSON.parse(JSON.stringify(codes))
    };
    newData.values.EL.hours = 8;
    localStorage.setItem('data', JSON.stringify(newData));
    return newData.values;
  }
  return saved.values;
}

function save(values){
  const monthKey = getCurrentMonthKey();
  localStorage.setItem('data', JSON.stringify({month:monthKey,values}));
}

function minusHalfDay(code){
  const data = load();
  data[code].hours = Math.max(0,data[code].hours-4);
  save(data);
  render();
}

/* RENDER */
function render(){

  const data = load();
  const app = document.getElementById('app');
  const summary = document.getElementById('summary');

  app.innerHTML='';

  let totalRFC = 0;
  let totalSB = 0;

  Object.keys(data).forEach(code=>{

    const item = data[code];
    const days = item.hours/workDayHours;

    if(['R','F','C'].includes(code)) totalRFC += days;
    if(['S','B'].includes(code)) totalSB += days;

    const div = document.createElement('div');

    div.className='card';

    div.innerHTML=`
      <h3>${code}</h3>
      <p>${item.name}</p>
      <p>Uren: ${item.hours}</p>
      <p>Dagen: ${days.toFixed(2)}</p>

      <input type="number" value="${item.hours}" onchange="update('${code}',this.value)">

      <button onclick="minusHalfDay('${code}')">-1/2 dag</button>
      <button onclick="resetCode('${code}')">Reset</button>
    `;

    app.appendChild(div);
  });

  summary.innerHTML=`

    <div class="summary-line"></div>

    <div class="summary">
      Totaal R + F + C:
      ${totalRFC.toFixed(2)} dagen
    </div>

    <div class="summary-small">
      ${getRFCText()}
    </div>

    <div class="summary-line"></div
