<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Verlofplanner 4.0</title>
<link rel="manifest" href="manifest.json">

<style>
:root {
  --bg-color: #f0f2f5;
  --card-bg: #ffffff;
  --primary-yellow: #ffeb3b;
  --text-black: #1a1a1a;
  --btn-shadow: 4px 4px 8px #bebebe, -4px -4px 8px #ffffff;
  --btn-pressed: inset 2px 2px 5px #bebebe, inset -2px -2px 5px #ffffff;
}

body { 
  font-family: 'Segoe UI', Arial, sans-serif; 
  margin:0; 
  padding:0; 
  background: var(--bg-color); 
  color: #333;
}

/* HEADER */
header { 
  background: var(--primary-yellow); 
  color:black; 
  padding:20px; 
  text-align:center; 
  position:relative; 
  box-shadow: 0 2px 8px rgba(0,0,0,0.1);
}

header::after{
  content:"Hanne";
  position:absolute;
  top:50%;
  left:50%;
  transform:translate(-50%, -50%);
  font-size:60px;
  font-family: 'Brush Script MT', cursive;
  color:#000;
  opacity:0.05;
  pointer-events:none;
}

/* SAMENVATTING (GROTER) */
.summary-container {
  background: white;
  margin: 15px;
  border-radius: 20px;
  padding: 20px 10px;
  box-shadow: var(--btn-shadow);
  border: 1px solid #eee;
}

.summary-item {
  text-align: center;
  padding: 10px 0;
}

.summary-title {
  font-size: 14px;
  text-transform: uppercase;
  letter-spacing: 1px;
  color: #666;
  margin-bottom: 5px;
}

.summary-days {
  font-size: 32px;
  font-weight: 900;
  color: var(--text-black);
  display: block;
}

.summary-small {
  font-size: 12px;
  color: #888;
  margin-top: 4px;
}

.summary-line {
  border-top: 1px solid #f0f0f0;
  margin: 15px 30px;
}

/* GRID (2 KOLOMMEN, 3 RIJEN) */
.container { 
  display:grid; 
  grid-template-columns: 1fr 1fr; /* Exact twee kolommen */
  gap:15px; 
  padding:15px; 
  margin-bottom: 30px;
}

.card { 
  background: var(--card-bg); 
  padding:15px; 
  border-radius:20px; 
  box-shadow: var(--btn-shadow);
  text-align: center;
  display: flex;
  flex-direction: column;
  justify-content: space-between;
}

.card h3 { 
  margin: 0; 
  color: var(--text-black); /* Terug naar zwart */
  font-size: 24px; 
  font-weight: 800;
}

.card p.sub-name { 
  margin: 2px 0 10px 0; 
  font-size: 11px; 
  color: #888; 
  height: 14px;
}

.card .days-count { 
  font-weight: bold; 
  font-size: 18px; 
  color: #333; 
  margin-bottom: 10px;
}

input { 
  width: 70%; 
  padding: 8px; 
  border: none; 
  border-radius: 10px; 
  background: #f0f2f5;
  box-shadow: inset 2px 2px 4px #bcbcbc, inset -2px -2px 4px #ffffff;
  text-align: center;
  font-size: 16px;
  margin: 0 auto 10px;
}

/* 3D BUTTONS */
button { 
  padding: 10px 5px; 
  width: 100%; 
  border: none;
  border-radius: 12px;
  background: #f0f2f5;
  font-weight: bold;
  font-size: 11px;
  cursor: pointer;
  box-shadow: var(--btn-shadow);
  transition: transform 0.1s;
  color: #444;
  margin-bottom: 8px;
  -webkit-tap-highlight-color: transparent;
}

button:active {
  box-shadow: var(--btn-pressed);
  transform: scale(0.95);
}

.btn-reset { color: #cc0000; margin-bottom: 0; }
.btn-minus { color: #0056b3; }

</style>
</head>

<body>

<header>
  <h2 style="margin:0; font-size: 22px;">Verlofplanner</h2>
</header>

<div class="summary-container" id="summary">
  </div>

<div class="container" id="app">
  </div>

<script>
const sbPlanning = {
  "januari": ["april", "mei", "juni", "juli", "augustus"],
  "februari": [], "maart": [], "april": [], "mei": [],
  "juni": ["september"], "juli": ["oktober"], "augustus": ["november"],
  "september": ["december"], "oktober": ["januari"],
  "november": ["februari"], "december": ["maart"]
};

const codes = {
 EL: {name:'Eindeloopbaan', hours:8},
 R: {name:'Overuren', hours:10.5},
 F: {name:'Feestdag', hours:0},
 C: {name:'Compensatie', hours:5.5},
 S: {name:'Verlof', hours:15},
 B: {name:'Verlof B', hours:120}
};

const workDayHours = 8;

function getFutureMonthText(){
  const now = new Date();
  const currentMonth = now.toLocaleString('nl-NL', { month: 'long' });
  const future = new Date(now.getFullYear(), now.getMonth() + 3, 1);
  const futureMonth = future.toLocaleString('nl-NL', { month: 'long' });
  return `Deadline: 15 ${currentMonth} voor ${futureMonth}`;
}

function getSBPlanningText() {
  const now = new Date();
  const currentMonthName = now.toLocaleString('nl-NL', { month: 'long' }).toLowerCase();
  const plannedMonths = sbPlanning[currentMonthName];
  if (plannedMonths && plannedMonths.length > 0) {
    return `SB gepland voor: ${plannedMonths.join(', ')}`;
  } else {
    return `SB: Geen planning voor ${currentMonthName}`;
  }
}

function getCurrentMonthKey(){
 const d = new Date();
 return d.getFullYear() + '-' + (d.getMonth()+1);
}

function load(){
 const saved = JSON.parse(localStorage.getItem('data'));
 const monthKey = getCurrentMonthKey();
 if(!saved || saved.month !== monthKey){
  const newData = { month: monthKey, values: JSON.parse(JSON.stringify(codes)) };
  localStorage.setItem('data', JSON.stringify(newData));
  return newData.values;
 }
 return saved.values;
}

function save(values){
 const monthKey = getCurrentMonthKey();
 localStorage.setItem('data', JSON.stringify({ month: monthKey, values }));
}

function update(code, value){
 const data = load();
 data[code].hours = parseFloat(value) || 0;
 save(data);
 render();
}

function minusHalfDay(code){
 const data = load();
 data[code].hours = Math.max(0, data[code].hours - 4);
 save(data);
 render();
}

function resetCode(code){
 const data = load();
 data[code].hours = 0;
 save(data);
 render();
}

function render(){
 const data = load();
 const app = document.getElementById('app');
 const summary = document.getElementById('summary');
 app.innerHTML='';

 let totalRFC = 0;
 let totalSB = 0;

 Object.keys(data).forEach(code=>{
  const item = data[code];
  const days = (item.hours / workDayHours);
  if(['R','F','C'].includes(code)) totalRFC += days;
  if(['S','B'].includes(code)) totalSB += days;

  const div = document.createElement('div');
  div.className='card';
  div.innerHTML = `
   <div>
     <h3>${code}</h3>
     <p class="sub-name">${item.name}</p>
     <div class="days-count">${days.toFixed(2)} <span style="font-size:12px; font-weight:normal;">dgn</span></div>
   </div>
   <div>
     <input type="number" step="0.5" value="${item.hours}" onchange="update('${code}', this.value)">
     <button class="btn-minus" onclick="minusHalfDay('${code}')">➖ ½ dag</button>
     <button class="btn-reset" onclick="resetCode('${code}')">🔄 Reset</button>
   </div>
  `;
  app.appendChild(div);
 });

 summary.innerHTML = `
   <div class="summary-item">
     <div class="summary-title">Totaal R + F + C</div>
     <div class="summary-days">${totalRFC.toFixed(2)} <span style="font-size:16px;">DAGEN</span></div>
     <div class="summary-small">${getFutureMonthText()}</div>
   </div>
   <div class="summary-line"></div>
   <div class="summary-item">
     <div class="summary-title">Totaal S + B</div>
     <div class="summary-days">${totalSB.toFixed(2)} <span style="font-size:16px;">DAGEN</span></div>
     <div class="summary-small">${getSBPlanningText()}</div>
   </div>
 `;
}

render();
if('serviceWorker' in navigator){ navigator.serviceWorker.register('sw.js'); }
</script>

</body>
</html>
