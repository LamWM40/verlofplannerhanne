<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Verlofplanner</title>

<style>
body { font-family: Arial; margin:0; padding:0; background:#f4f4f4; }

header { background:yellow; padding:20px; text-align:center; }

.container { display:grid; grid-template-columns: repeat(3,1fr); gap:10px; padding:10px; }

.card { background:#fff; padding:10px; border-radius:10px; }

input, button { width:100%; margin-top:5px; padding:5px; }

.summary { text-align:center; padding:10px; font-weight:bold; }
</style>
</head>

<body>

<header><h2>Verlofplanner</h2></header>

<div id="summary" class="summary"></div>
<div id="app" class="container"></div>

<script>
const codes = {
 EL:{name:'Eindeloopbaan',hours:8},
 R:{name:'Overuren',hours:10.5},
 F:{name:'Feestdag',hours:0},
 C:{name:'Compensatie',hours:5.5},
 S:{name:'Verlof',hours:15},
 B:{name:'Verlof B',hours:120}
};

const workDayHours = 8;

function getFutureMonthText(){
 const m = new Date().getMonth();
 const names = ['januari','februari','maart','april','mei','juni','juli','augustus','september','oktober','november','december'];

 let target='';
 switch(m){
  case 0: target='oktober'; break;
  case 1: target='november'; break;
  case 2: target='december'; break;
  case 3:
  case 4:
  case 5:
  case 6:
  case 7: target='januari'; break;
  case 8: target='juni'; break;
  case 9: target='augustus'; break;
  case 10:
  case 11: target='september'; break;
 }

 return `15 ${names[m]} = ${target}`;
}

function load(){
 try{
  const raw = localStorage.getItem('data');
  if(!raw) throw "empty";

  const parsed = JSON.parse(raw);
  if(!parsed.values) throw "broken";

  return parsed.values;

 }catch(e){
  const fresh = JSON.parse(JSON.stringify(codes));
  localStorage.setItem('data', JSON.stringify({values:fresh}));
  return fresh;
 }
}

function save(values){
 localStorage.setItem('data', JSON.stringify({values}));
}

function update(code,val){
 const d = load();
 d[code].hours = isNaN(parseFloat(val)) ? 0 : parseFloat(val);
 save(d);
 render();
}

function minusHalfDay(code){
 const d = load();
 d[code].hours = Math.max(0, d[code].hours - 4);
 save(d);
 render();
}

function resetCode(code){
 const d = load();
 d[code].hours = 0;
 save(d);
 render();
}

function render(){
 const data = load();
 const app = document.getElementById('app');
 const summary = document.getElementById('summary');

 app.innerHTML='';

 let rfc=0;
 let sb=0;

 Object.keys(data).forEach(code=>{
  const h = data[code].hours;
  const d = h / workDayHours;

  if(['R','F','C'].includes(code)) rfc += d;
  if(['S','B'].includes(code)) sb += d;

  const el = document.createElement('div');
  el.className='card';

  el.innerHTML=`
   <b>${code}</b><br>
   ${data[code].name}<br>
   Uren: ${h}<br>
   Dagen: ${d.toFixed(2)}
   <input type="number" value="${h}" onchange="update('${code}',this.value)">
   <button onclick="minusHalfDay('${code}')">-1/2 dag</button>
   <button onclick="resetCode('${code}')">Reset</button>
  `;

  app.appendChild(el);
 });

 summary.innerHTML = `
  R+F+C: ${rfc.toFixed(2)} dagen<br>
  ${getFutureMonthText()}<br><br>
  S+B: ${sb.toFixed(2)} dagen<br>
  ${getFutureMonthText()}
 `;
}

render();
</script>

</body>
</html>
