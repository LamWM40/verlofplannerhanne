<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Verlofplanner 3.0</title>
<link rel="manifest" href="manifest.json">

<style>
:root {
  --bg-color: #f0f2f5;
  --card-bg: #ffffff;
  --primary-yellow: #ffeb3b;
  --accent-shadow: rgba(0,0,0,0.1);
  --btn-shadow: 3px 3px 6px #bebebe, -3px -3px 6px #ffffff;
  --btn-pressed: inset 2px 2px 5px #bebebe, inset -2px -2px 5px #ffffff;
}

body { 
  font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; 
  margin:0; 
  padding:0; 
  background: var(--bg-color); 
  color: #333;
}

/* HEADER */
header { 
  background: var(--primary-yellow); 
  color:black; 
  padding:25px 20px; 
  text-align:center; 
  position:relative; 
  overflow:hidden;
  box-shadow: 0 4px 10px rgba(0,0,0,0.1);
}

header::after{
  content:"Hanne";
  position:absolute;
  top:50%;
  left:50%;
  transform:translate(-50%, -50%);
  font-size:70px;
  font-family: 'Brush Script MT', cursive;
  color:#e6d800;
  opacity:0.3;
  pointer-events:none;
}

.header-line {
  border-top:2px solid #000;
  margin-top:10px;
  opacity: 0.2;
}

/* SAMENVATTING */
.summary-container {
  background: white;
  margin: 15px;
  border-radius: 15px;
  padding: 10px 5px;
  box-shadow: var(--btn-shadow);
}

.summary {
  text-align:center;
  padding:5px;
  font-weight:bold;
  font-size:18px;
  color: #222;
}

.summary-small {
  text-align:center;
  font-size:13px;
  color: #666;
  margin-bottom:10px;
}

.summary-line {
  border-top:1px solid #eee;
  margin:10px 40px;
}

/* GRID */
.container { 
  display:grid; 
  grid-template-columns: repeat(auto-fit, minmax(100px, 1fr)); 
  gap:15px; 
  padding:15px; 
}

.card { 
  background: var(--card-bg); 
  padding:15px; 
  border-radius:20px; 
  box-shadow: var(--btn-shadow);
  text-align: center;
}

.card h3 { margin: 0 0 5px 0; color: #fbc02d; font-size: 22px; }
.card p { margin: 2px 0; font-size: 13px; color: #555; }
.card .days-label { font-weight: bold; font-size: 16px; color: #000; margin: 5px 0; }

input { 
  width: 80%; 
  padding: 8px; 
  margin: 10px 0; 
  border: none; 
  border-radius: 10px; 
  background: #f0f2f5;
  box-shadow: inset 2px 2px 5px #bcbcbc, inset -2px -2px 5px #ffffff;
  text-align: center;
  font-size: 16px;
}

/* 3D BUTTONS */
button { 
  margin-top:10px; 
  padding:12px 5px; 
  width:100%; 
  border: none;
  border-radius: 12px;
  background: #f0f2f5;
  font-weight: bold;
  font-size: 12px;
  cursor: pointer;
  box-shadow: var(--btn-shadow);
  transition: all 0.2s ease;
  color: #444;
  -webkit-tap-highlight-color: transparent;
}

button:active {
  box-shadow: var(--btn-pressed);
  transform: translateY(2px);
}

.btn-reset { color: #d32f2f; }
.btn-minus { color: #1976d2; }

</style>
</head>

<body>

<header>
<h2>Verlofplanner</h2>
<div class="header-line"></div>
</header>

<div class="summary-container" id="summary"></div>
<div class="container" id="app"></div>

<script>
const sbPlanning = {
  "januari": ["april", "mei", "juni", "juli", "augustus"],
  "februari": [], "maart": [], "april": [], "mei": [],
  "juni": ["september"], "juli": ["oktober"], "augustus": ["november"],
  "september": ["december"], "oktober": ["januari"],
  "november": ["februari"], "december": ["maart"]
};

const codes = {
 EL: {name:'Eindeloopbaan', hours:8},
 R: {name:'Overuren', hours:10.5},
 F: {name:'Feestdag', hours:0},
 C: {name:'Compensatie', hours:5.5},
 S: {name:'Verlof', hours:15},
 B: {name:'Verlof B', hours:120}
};

const workDayHours = 8;

function getFutureMonthText(){
  const now = new Date();
  const currentMonth = now.toLocaleString('nl-NL', { month: 'long' });
  const future = new Date(now.getFullYear(), now.getMonth() + 3, 1);
  const futureMonth = future.toLocaleString('nl-NL', { month: 'long' });
  return `15 ${currentMonth} = ${futureMonth}`;
}

function getSBPlanningText() {
  const now = new Date();
  const currentMonthName = now.toLocaleString('nl-NL', { month: 'long' }).toLowerCase();
  const plannedMonths = sbPlanning[currentMonthName];
  if (plannedMonths && plannedMonths.length > 0) {
    return `SB-Planning voor: ${plannedMonths.join(', ')}`;
  } else {
    return `SB-Planning: Geen data voor ${currentMonthName}`;
  }
}

function getCurrentMonthKey(){
 const d = new Date();
 return d.getFullYear() + '-' + (d.getMonth()+1);
}

function load(){
 const saved = JSON.parse(localStorage.getItem('data'));
 const monthKey = getCurrentMonthKey();
 if(!saved || saved.month !== monthKey){
  const newData = { month: monthKey, values: JSON.parse(JSON.stringify(codes)) };
  localStorage.setItem('data', JSON.stringify(newData));
  return newData.values;
 }
 return saved.values;
}

function save(values){
 const monthKey = getCurrentMonthKey();
 localStorage.setItem('data', JSON.stringify({ month: monthKey, values }));
}

function update(code, value){
 const data = load();
 data[code].hours = parseFloat(value) || 0;
 save(data);
 render();
}

function minusHalfDay(code){
 const data = load();
 data[code].hours = Math.max(0, data[code].hours - 4);
 save(data);
 render();
}

function resetCode(code){
 const data = load();
 data[code].hours = 0;
 save(data);
 render();
}

function render(){
 const data = load();
 const app = document.getElementById('app');
 const summary = document.getElementById('summary');
 app.innerHTML='';

 let totalRFC = 0;
 let totalSB = 0;

 Object.keys(data).forEach(code=>{
  const item = data[code];
  const days = (item.hours / workDayHours);
  if(['R','F','C'].includes(code)) totalRFC += days;
  if(['S','B'].includes(code)) totalSB += days;

  const div = document.createElement('div');
  div.className='card';
  div.innerHTML = `
   <h3>${code}</h3>
   <p>${item.name}</p>
   <div class="days-label">${days.toFixed(2)} dgn</div>
   <input type="number" step="0.5" value="${item.hours}" onchange="update('${code}', this.value)">
   <button class="btn-minus" onclick="minusHalfDay('${code}')">➖ ½ dag</button>
   <button class="btn-reset" onclick="resetCode('${code}')">🔄 Reset</button>
  `;
  app.appendChild(div);
 });

 summary.innerHTML = `
   <div class="summary">Totaal R+F+C: ${totalRFC.toFixed(2)} dgn</div>
   <div class="summary-small">${getFutureMonthText()}</div>
   <div class="summary-line"></div>
   <div class="summary">Totaal S+B: ${totalSB.toFixed(2)} dgn</div>
   <div class="summary-small">${getSBPlanningText()}</div>
 `;
}

render();
if('serviceWorker' in navigator){ navigator.serviceWorker.register('sw.js'); }
</script>

</body>
</html>
