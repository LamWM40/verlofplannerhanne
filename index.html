<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Verlofplanner</title>
<link rel="manifest" href="manifest.json">
<style>
body { font-family: Arial; margin:0; padding:0; background:#f4f4f4; }

header { 
  background:yellow; 
  color:black; 
  padding:10px; 
  text-align:center; 
}

.header-line {
  border-top:2px solid #000;
  margin-top:10px;
}

.summary {
  text-align:center;
  padding:10px;
  font-weight:bold;
}

.summary-line {
  border-top:1px solid #000;
  margin:10px 20px;
}

.container { display:grid; grid-template-columns: 1fr 1fr 1fr; gap:10px; padding:10px; }

.card { background:#fff; padding:10px; border-radius:10px; box-shadow:0 2px 5px rgba(0,0,0,0.1);} 

input { width:100%; padding:5px; }

.progress { height:10px; background:#ddd; border-radius:5px; margin-top:5px; }

.bar { height:10px; border-radius:5px; background:#999; } /* 🔧 geen groen meer */

.deadline { font-size:12px; margin-top:5px; }

button { margin-top:5px; padding:5px; width:100%; }

</style>
</head>
<body>

<header>
<h2>Verlofplanner</h2>
<div class="header-line"></div>
</header>

<div id="summary"></div>

<div class="container" id="app"></div>

<script>
const codes = {
 EL: {name:'Eindeloopbaan', hours:8},
 R: {name:'Overuren', hours:10.5},
 F: {name:'Feestdag', hours:0},
 C: {name:'Compensatie', hours:5.5},
 S: {name:'Verlof', hours:15},
 B: {name:'Verlof B', hours:120}
};

const workDayHours = 8;
const MAX_EL_DAYS = 30;

// 🔧 maand +3 → nu enkel "15 maand"
function getFutureMonth(){
  const now = new Date();
  const future = new Date(now.getFullYear(), now.getMonth() + 3, 1);
  const maandNaam = future.toLocaleString('nl-NL', { month: 'long' });
  return `15 ${maandNaam}`;
}

function getCurrentMonthKey(){
 const d = new Date();
 return d.getFullYear() + '-' + (d.getMonth()+1);
}

function load(){
 const saved = JSON.parse(localStorage.getItem('data'));
 const monthKey = getCurrentMonthKey();

 if(!saved || saved.month !== monthKey){
  const newData = { month: monthKey, values: JSON.parse(JSON.stringify(codes)) };
  newData.values.EL.hours = 8;
  localStorage.setItem('data', JSON.stringify(newData));
  return newData.values;
 }
 return saved.values;
}

function save(values){
 const monthKey = getCurrentMonthKey();
 localStorage.setItem('data', JSON.stringify({ month: monthKey, values }));
}

function minusHalfDay(code){
 const data = load();
 data[code].hours = Math.max(0, data[code].hours - 4);
 save(data);
 render();
}

function render(){
 const data = load();
 const app = document.getElementById('app');
 const summary = document.getElementById('summary');

 app.innerHTML='';

 let totalRFC = 0;
 let totalSB = 0;

 Object.keys(data).forEach(code=>{
  const item = data[code];
  const days = (item.hours / workDayHours);

  if(['R','F','C'].includes(code)) totalRFC += days;
  if(['S','B'].includes(code)) totalSB += days;

  let percent = Math.min(100, item.hours);
  let message = '';

  if(['EL','R','F','C'].includes(code)){
    const today = new Date().getDate();
    const progressDays = Math.min(today, 15);
    percent = (progressDays / 15) * 100;
    message = getFutureMonth();
  }

  const div = document.createElement('div');
  div.className='card';
  div.innerHTML = `
   <h3>${code}</h3>
   <p>${item.name}</p>
   <p>Uren: ${item.hours}</p>
   <p>Dagen: ${days.toFixed(2)}</p>
   ${code === 'EL' ? `<p>Max: ${MAX_EL_DAYS} dagen</p>` : ''}
   <div class="progress"><div class="bar" style="width:${percent}%"></div></div>
   ${['EL','R','F','C'].includes(code) ? `<div class="deadline">${message}</div>` : ''}
   <input type="number" value="${item.hours}" onchange="update('${code}', this.value)">
   <button onclick="minusHalfDay('${code}')">-1/2 dag</button>
   <button onclick="resetCode('${code}')">Reset</button>
  `;
  app.appendChild(div);
 });

 // 🔧 Samenvatting
 summary.innerHTML = `
   <div class="summary-line"></div>
   <div class="summary">Totaal R + F + C: ${totalRFC.toFixed(2)} dagen</div>
   <div class="summary-line"></div>
   <div class="summary">Totaal S + B: ${totalSB.toFixed(2)} dagen</div>
   <div class="summary-line"></div>
 `;
}

function update(code, value){
 const data = load();
 data[code].hours = parseFloat(value);
 save(data);
 render();
}

function resetCode(code){
 const data = load();
 data[code].hours = 0;
 save(data);
 render();
}

render();

if('serviceWorker' in navigator){
 navigator.serviceWorker.register('sw.js');
}
</script>

</body>
</html>
