<!DOCTYPE html>
<html lang="nl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Verlof Planner</title>
  <link rel="manifest" href="https://progressier.app/ZQMaV8scWjUel7pYaVda/progressier.json"/>
  <script defer src="https://progressier.app/ZQMaV8scWjUel7pYaVda/script.js"></script>

  <style>
    body { font-family: Arial; margin: 10px; background:#eef2f7 }
    h1 { text-align:center }
    .grid { display:grid; grid-template-columns: 1fr 1fr 1fr; gap:10px }
    .card { background:white; padding:15px; border-radius:12px; box-shadow:0 2px 6px rgba(0,0,0,0.1)}
    input, select { padding:10px; margin:5px 0; width:100%; border-radius:8px; border:1px solid #ccc }
    button { padding:10px; width:100%; background:#007bff; color:white; border:none; border-radius:8px; font-weight:bold }

    .bar-bg { width:100%; height:18px; background:#ddd; border-radius:10px; overflow:hidden; margin-top:10px }
    .bar-fill { height:100%; background:#28a745; width:0%; transition:0.3s }
  </style>
</head>
<body>

<h1>📅 Verlof Planner</h1>

<div class="grid">

  <!-- Kolom 1 -->
  <div class="card">
    <h3>Codes</h3>
    <p>EL</p>
    <p>R</p>
    <p>F</p>
    <p>C</p>
    <p>S</p>
    <p>B</p>
  </div>

  <!-- Kolom 2 -->
  <div class="card">
    <h3>Overzicht</h3>
    <div id="overzicht"></div>

    <hr>
    <b id="dagen"></b>

    <hr>
    <b>Resterend verlof</b>
    <p id="resterend"></p>

    <div class="bar-bg">
      <div class="bar-fill" id="bar"></div>
    </div>
  </div>

  <!-- Kolom 3 -->
  <div class="card">
    <h3>Uren ingeven</h3>
    <select id="code">
      <option value="EL">EL</option>
      <option value="R">R</option>
      <option value="F">F</option>
      <option value="C">C</option>
      <option value="S">S</option>
      <option value="B">B</option>
    </select>
    <input type="number" id="uren" placeholder="Aantal uren">
    <input type="number" id="urenPerDag" placeholder="Uren per werkdag (bv 8)">
    <button onclick="toevoegen()">Toevoegen</button>
  </div>

</div>

<script>
let data = JSON.parse(localStorage.getItem('data')) || {};

// vaste verlofwaarden
const allowance = {
  S: 15,
  B: 120
};

function toevoegen(){
  let code = document.getElementById('code').value;
  let uren = parseFloat(document.getElementById('uren').value);

  if(!data[code]) data[code] = 0;
  data[code] += uren;

  localStorage.setItem('data', JSON.stringify(data));
  toon();
}

function toon(){
  let html = '';
  let totaalUren = 0;
  let urenPerDag = parseFloat(document.getElementById('urenPerDag').value) || 8;

  let codes = ['EL','R','F','C','S','B'];

  codes.forEach(c => {
    let val = data[c] || 0;
    html += `<p>${c}: ${val} uur</p>`;
    totaalUren += val;
  });

  document.getElementById('overzicht').innerHTML = html;

  let dagen = totaalUren / urenPerDag;
  document.getElementById('dagen').innerText = `Totaal: ${dagen.toFixed(2)} werkdagen`;

  // Resterend verlof
  let used = (data['S'] || 0) + (data['B'] || 0);
  let totalAllowance = allowance.S + allowance.B;
  let remaining = totalAllowance - used;
  let percentUsed = (used / totalAllowance) * 100;

  document.getElementById('resterend').innerText = `${remaining.toFixed(2)} uur over`;
  document.getElementById('bar').style.width = percentUsed + "%";
}

toon();
</script>

</body>
</html>
